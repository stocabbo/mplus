<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007aff">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Pianifica obiettivo MPLUS</title>
</head>
<body>
  <main class="phone planner-page">
    <header class="app-header">
      <div><p class="eyebrow">MPLUS</p><h1>Pianifica un obiettivo</h1></div>
      <a class="back-link" href="index.html">← Oggi</a>
    </header>
    <section id="active_plan" class="active-plan" hidden></section>
    <form id="planner_form" class="planner-form">
      <label>Saldo attuale (facoltativo)
        <input id="current_balance" type="number" min="0" max="240" step="1" placeholder="es. 20 minuti">
        <span class="help">Inseriscilo in minuti, oppure lascia vuoto per partire da zero.</span>
      </label>
      <div class="balance-import">
        <label>Importa saldo da testo
          <textarea id="balance_text" rows="2" placeholder="Incolla ad esempio: Saldo MPLUS +02:15"></textarea>
        </label>
        <button id="import_balance" class="secondary-btn" type="button">Rileva saldo</button>
        <p id="import_feedback" class="feedback" role="status" aria-live="polite"></p>
      </div>
      <label>Obiettivo MPLUS
        <input id="target_balance" type="number" min="0.25" max="4" step="0.25" required placeholder="es. 3 ore">
      </label>
      <div class="duration-row">
        <label>Entro
          <input id="duration" type="number" min="1" max="365" value="4" required>
        </label>
        <label>Periodo
          <select id="duration_unit"><option value="weeks">settimane</option><option value="days">giorni</option></select>
        </label>
      </div>
      <fieldset>
        <legend>Giorni da evitare</legend>
        <p class="help">I weekend sono già esclusi.</p>
        <div class="exclusion-row">
          <input id="excluded_date" type="date" aria-label="Data da escludere">
          <select id="excluded_reason" aria-label="Motivo"><option value="Ferie">Ferie</option><option value="Smart working">Smart working</option><option value="Indisponibile">Altro</option></select>
          <button id="add_exclusion" class="secondary-btn" type="button">Aggiungi</button>
        </div>
        <ul id="exclusions" class="exclusions"></ul>
      </fieldset>
      <button class="primary-btn" type="submit">Crea le alternative</button>
    </form>
    <section id="planner_results" class="planner-results" aria-live="polite"></section>
    <p id="planner_feedback" class="feedback" role="status" aria-live="polite"></p>
    <section id="progress_history" class="progress-history" hidden></section>
  </main>
  <script src="tracking.js"></script>
  <script src="planner.js"></script>
</body>
</html>
