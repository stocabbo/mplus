
<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-startup-image" href="apple-splash-1170x2532.png">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcolo Giornaliero MPLUS</title>
  <meta name="description" content="Calcola l'orario di uscita ottimale dal lavoro con supporto offline.">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#007aff">
</head>
<body>
  <main class="phone">
    <header class="app-header">
      <div>
        <p class="eyebrow">MPLUS</p>
        <h1>Organizza la giornata</h1>
      </div>
      <button id="settings_btn" class="icon-btn" type="button" aria-label="Apri impostazioni" aria-haspopup="dialog">⚙️</button>
    </header>

    <div class="input-group">
      <label for="ora_ingresso">Ora ingresso (HH:MM)</label>
      <div class="input-row">
        <input type="time" id="ora_ingresso" required>
        <button id="set_now" class="secondary-btn" type="button">Adesso</button>
      </div>
    </div>

    <div class="toggle-group">
      <label class="switch">
        <input type="checkbox" id="toggle_giornata" aria-labelledby="toggle_label">
        <span class="slider"></span>
      </label>
      <span id="toggle_label">Corta</span>
    </div>

    <div id="output" class="result-cards" aria-live="polite"></div>
    <div id="countdown" class="countdown" aria-live="off"></div>
    <button id="share_result" class="share-btn" type="button" hidden>Condividi riepilogo</button>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>

    <a class="planner-link" href="planner.html">
      <span><strong>Pianifica un obiettivo</strong><small>Crea un calendario per accumulare ore MPLUS</small></span>
      <span aria-hidden="true">→</span>
    </a>
  </main>

  <div id="settings_panel" class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings_title" hidden>
    <div class="settings-content" tabindex="-1">
      <button id="close_settings" class="close-btn" type="button" aria-label="Chiudi impostazioni">×</button>
      <h2 id="settings_title">Impostazioni</h2>
      <label>Extra giornata corta (min)
        <input type="number" id="opt_extra_corta" min="0">
      </label>
      <label>Recupero giornata lunga (min)
        <input type="number" id="opt_recupero_lunga" min="0">
      </label>
      <label>Pausa pranzo (min)
        <input type="number" id="opt_pausa" min="20" max="120">
      </label>
      <div class="settings-actions">
        <button id="reset_settings" class="secondary-btn" type="button">Ripristina</button>
        <button id="save_settings" class="primary-btn" type="button">Salva</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <audio id="ping" src="ping.mp3" preload="auto"></audio>


<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').then(reg => {
        console.log('✅ Service Worker registrato:', reg.scope);
      }).catch(err => {
        console.error('❌ Service Worker registration failed:', err);
      });
    });
  }
</script>

</body>
</html>
